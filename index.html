<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ayu Tiwari — Think. Create. Experiment.</title>
    <meta
      name="description"
      content="Portfolio of Ayu Tiwari — a Class 11 student and evolving builder exploring technology, programming, game development and entrepreneurship."
    />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:title" content="Ayu Tiwari — Think. Create. Experiment." />
    <meta
      property="og:description"
      content="An evolving builder who thinks critically, experiments with technology and turns ideas into projects."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Font: one variable family (Bricolage Grotesque) loaded without blocking first paint.
         System fonts are used until it arrives. To self-host later, download it and add an @font-face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap"
      />
    </noscript>
    %CSS%
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:48px;font-family:system-ui,sans-serif;color:#eaf1ff">
        <strong>Ayu Tiwari</strong> — Think. Create. Experiment. This portfolio is an interactive experience and needs
        JavaScript to run.
      </p>
    </noscript>
    %JS%
  </body>
</html>
